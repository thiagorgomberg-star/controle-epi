{% extends "base.html" %}
{% block titulo %}Entrar | Controle de EPI{% endblock %}
{% block conteudo %}
<main class="container-estreito">
  <div class="cartao">
    <h1>Controle de EPI</h1>
    <p class="subtitulo">Acesso do colaborador. Use seu e-mail corporativo.</p>
    <form method="post">
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" required autofocus>
      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" required>
      <button class="botao" type="submit" style="width:100%">Entrar</button>
    </form>
    <p class="rodape-login">
      Ainda não tem acesso? <a href="{{ url_for('auth.cadastro') }}">Criar acesso</a>
    </p>
  </div>
</main>
{% endblock %}
